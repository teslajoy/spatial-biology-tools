- id: deep-visual-proteomics
  name: Deep Visual Proteomics (DVP)
  category: spatial-proteomics
  tasks:
  - single-cell-spatial-proteome
  - laser-microdissection-guided-MS
  model_type: deep-learning image segmentation + classification driving laser capture, then ultrasensitive
    MS
  modality:
  - microscopy imaging + MS proteomics
  tissue: multi-tissue; demonstrated in liver (proteotoxicity), skin, cancer
  data_types:
    input:
    - IF/H&E images
    - LMD coordinates
    - MS raw
    output:
    - cell-type-resolved protein abundance matrices with spatial provenance
  org: Mann lab, MPI Biochemistry
  paper: https://doi.org/10.1038/s41587-022-01302-5
  maturity: T
  reality_check: 'the most important entry in this file for anyone doing imaging. DVP closes the loop
    that antibody-panel spatial proteomics cannot: unbiased, discovery-scale protein measurement with
    cell-level spatial attribution. no 40-marker panel ceiling. cost is throughput - it is microdissection,
    so it does not scale to whole-slide the way CODEX does.

    '
  endorsements:
  - source: Nat Methods 2026 AI proteomics Perspective
    claim: highlighted as the AI-driven framework integrating imaging with ultrasensitive MS to map protein
      expression at single-cell resolution
    url: https://www.nature.com/articles/s41592-026-03085-y
  - source: Nature 2025
    claim: mapped proteotoxicity in a genetic liver disease
    url: https://doi.org/10.1038/s41586-025-08885-4
  omics:
  - protein-MS
  - morphology
