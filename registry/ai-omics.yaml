- id: ai-proteomics-perspective
  name: 'AI proteomics: from protein identification to virtual cells'
  category: review
  tasks:
  - landscape-orientation
  model_type: Perspective (Nature Methods), 60+ authors
  modality:
  - MS-based proteomics
  - spatial proteomics
  - multi-omics
  tissue: cross-tissue
  data_types:
    input:
    - literature
    output:
    - six-area taxonomy
    - curated tool table (Supplementary Table 1
    - XLSX)
  org: Guo (Westlake), Mann (MPI), Zhang (Baylor) et al.
  paper: https://www.nature.com/articles/s41592-026-03085-y
  data: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41592-026-03085-y/MediaObjects/41592_2026_3085_MOESM1_ESM.xlsx
  license: subscription (abstract + refs open)
  maturity: I
  reality_check: 'published 28 July 2026. six areas where AI is moving MS proteomics: peptide/protein
    identification and quantification, protein-protein interactions and complexes, spatial and perturbation
    proteomics, multi-omics integration, and AI virtual cells. the operationally useful part is Supplementary
    Table 1 - a curated table of tools with model, model type, task, year and article link, which is close
    to this registry''s schema and worth ingesting directly. note the framing: the paper''s closing argument
    is a call for an "AI-friendly ecosystem" among data producers and consumers. that is a data-infrastructure
    argument, not a modelling one.

    '
  omics:
  - protein-MS
- id: mm-foundation-models-cell-bio
  name: Towards multimodal foundation models in molecular cell biology
  category: review
  modality:
