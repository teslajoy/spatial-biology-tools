  reality_check: 'Nat Commun 2025. the proof that LLM-style architectures transfer to MS spectra, which
    is the same argument DINOv2-on-histology made three years earlier. expect the same trajectory: strong
    headline numbers, slow displacement of the incumbent.

    '
  endorsements:
  - source: Nat Methods 2026 AI proteomics Perspective (Sun et al.)
    claim: highlighted as demonstrating that LLM architectures can be adapted to improve peptide identification,
