- id: quantms
  name: quantms
  category: pipeline
  tasks:
  - quantitative-proteomics-reanalysis
  model_type: cloud-native nextflow pipeline
  modality:
  - DDA and DIA MS
  tissue: cross-tissue
  data_types:
