  github: bigbio/quantms
  license: Apache-2.0
  maturity: I
  reality_check: 'Nat Methods 2024. enables large-scale reanalysis of public proteomics data with standardised
    output - the thing that makes public archives trainable rather than merely deposited. structurally
    the closest analogue in this registry to the FHIR-aggregation problem: heterogeneous repositories,
    one queryable surface.

    '
  endorsements:
  - source: Nat Methods 2026 AI proteomics Perspective (Sun et al.)
    claim: highlighted for enabling large-scale reanalysis of public datasets, providing standardised
      and reproducible resources for machine learning
    url: https://www.nature.com/articles/s41592-026-03085-y
