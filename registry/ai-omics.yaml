  github: vdemichev/DiaNN
  license: free for academic use
  maturity: T
  reality_check: 'the widely adopted DIA workhorse and the reference point every newer method is measured
    against. described in the 2026 Perspective as a widely adopted neural-network tool for improving identification.
    entrenched enough that switching costs are real.

    '
