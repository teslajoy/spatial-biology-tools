  - source: Nat Methods 2026 AI proteomics Perspective (Sun et al.)
    claim: singled out as the widely adopted neural-network tool for improving peptide and protein identification
      in MS proteomics
    url: https://www.nature.com/articles/s41592-026-03085-y
