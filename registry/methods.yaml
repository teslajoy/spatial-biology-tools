- id: cellpose-sam
  name: Cellpose-SAM
  category: segmentation
  tasks:
  - cell-instance-segmentation
  model_type: SAM image encoder + newly trained decoder + Cellpose-style flow postprocessing
  modality:
  - phase contrast
  - brightfield
  - fluorescence microscopy
  - H&E
  training:
    corpus: Cellpose generalist corpus + SAM pretraining
    tissues: multi-modality cell culture and tissue
    public: true
  org: Stringer/Pachitariu, Janelia
  paper: https://doi.org/10.1101/2025.04.28.651001
  github: MouseLand/cellpose
  license: BSD-3
  maturity: R
  reality_check: 'strongest general default and dominant on phase contrast. a March 2026 comparative study
    places it among the strongest microscopy-specific baselines and reports it outperforming SAM, SAM3
    and CellSAM in aggregate. still needs diameter sanity-checking per dataset.

    '
  endorsements:
  - source: Revisiting foundation models for cell instance segmentation (Archit et al., Mar 2026)
    claim: outperforms SAM, SAM3 and CellSAM in aggregate; SAM2 excluded as inferior
    url: https://www.emergentmind.com/topics/cellposesam
  - source: bioRxiv 2026.04.18 foundation segmentation benchmark
    claim: strong performance on phase contrast; SAM-based models consistent on fluorescence cell culture
    url: https://www.biorxiv.org/content/10.64898/2026.04.18.719315v1
  tissue: any; cell culture, tissue sections
  data_types:
    input:
    - TIFF/PNG 2D or 3D image stacks
    output:
    - instance label mask (uint16)
    - flows
  omics:
  - morphology
- id: stardist
  name: StarDist
  category: segmentation
  tasks:
  - nuclear-segmentation
  model_type: CNN with star-convex polygon parameterisation
  modality:
  - DAPI/Hoechst fluorescence
  - H&E
  - IHC
  org: Weigert/Schmidt
  paper: https://arxiv.org/abs/1806.03535
  github: stardist/stardist
  license: BSD-3
  maturity: T
  reality_check: 'still the best single choice for IHC and DAPI nuclei despite the foundation model wave.
    fine-tunes from as few as 20-50 annotated images and is often faster than Cellpose on the same GPU.
    star-convexity fails on complex whole-cell morphology - nuclei only.

    '
  tissue: histology and DAPI, any organ
  data_types:
    input:
    - 2D/3D image, nuclear channel
    output:
    - star-convex polygon instances
    - label mask
  omics:
  - morphology
- id: mesmer
  name: Mesmer (DeepCell)
  category: segmentation
  tasks:
  - whole-cell-segmentation
  - nuclear-segmentation
  model_type: CNN (ResNet-FPN), dual-channel nuclear + membrane input
  modality:
  - CODEX
  - MIBI
  - IMC
  - Vectra
  - multiplexed IF
  training:
    corpus: TissueNet
    tissues: multi-tissue multiplexed
    public: true
  org: Van Valen lab, Caltech
  paper: https://www.nature.com/articles/s41587-021-01094-0
  github: vanvalenlab/deepcell-tf
  data: TissueNet (https://datasets.deepcell.org)
  license: modified Apache (non-commercial terms)
  maturity: T
  reality_check: 'purpose-built beats generalist here. takes nuclear AND membrane channels and produces
    masks that respect real membrane boundaries, which generalist models cannot do from a single channel.
    the default for CyCIF/CODEX/mIHC pipelines.

    '
  endorsements:
  - source: J Imaging 2026 segmentation review
    claim: strong generalisability across tissues and imaging protocols for multiplexed images
    url: https://doi.org/10.3390/jimaging12070297
  tissue: multi-tissue (TissueNet)
  data_types:
    input:
    - '2-channel image: nuclear + membrane'
    output:
    - whole-cell and nuclear label masks
  omics:
  - protein-img
