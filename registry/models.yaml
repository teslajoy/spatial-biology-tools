    - AnnData spatial (Visium/VisiumHD/Xenium/MERFISH)
    output:
    - cell/spot embedding
    - imputed expression
    - deconvolution
- id: kronos
  name: KRONOS
  category: spatial-proteomics-FM
  tasks:
  - cell-phenotyping
  - region-classification
  - patient-stratification
  - artifact-detection
  model_type: ViT-S/16 DINOv2 with channel-wise stem + sinusoidal marker-identity embeddings
  modality:
  - CODEX
  - COMET
  - IBEX
  - and 5 other fluorescence multiplex platforms
  training:
    corpus: SPM-47M - 47M single-marker patches from 3.67M multiplex patches
    tissues: 16 tissue types (normal + malignant), 175 protein markers, 30 cohorts, 5 institutions
    public: partial (56% public / 44% in-house)
  org: Mahmood Lab
  paper: https://arxiv.org/abs/2506.03373
  github: mahmoodlab/KRONOS
  license: CC-BY-NC-ND-4.0
  maturity: R
  reality_check: 'panel-agnostic by construction - marker-identity embeddings mean it does not break when
    your antibody panel differs from the training panels. that solves the single biggest blocker to cross-study
    spatial proteomics. small model (ViT-S), cheap to run.

    '
  tissue: 16 tissue types, normal and malignant
  data_types:
    input:
    - multiplex OME-TIFF, per-marker channels + DAPI
    - cell masks
    output:
    - marker-specific patch embedding
    - cell phenotype
    - region class
  endorsements:
  - source: Nat Methods 2026 AI proteomics Perspective (Sun et al.)
    claim: spatial proteomics named as one of six areas AI is actively reshaping, following Method of
      the Year 2024
    url: https://www.nature.com/articles/s41592-026-03085-y
