- id: virchow2
  name: Virchow2
  category: patch-encoder
  tasks:
  - tile-embedding
  - tile-classification
  - biomarker-prediction
  model_type: vision SSL (modified DINOv2), ViT-H/14, 632M params
  modality:
  - H&E WSI
  - IHC
  - multi-stain brightfield
  training:
    corpus: 3.1M WSIs / 1.7B tiles, 225401 patients
    tissues: pan-cancer, globally diverse institutions, mixed magnification, diverse stains
    public: false
  org: Paige + MSK (with Microsoft Research)
  paper: https://arxiv.org/abs/2408.00738
  github: null
  hf: paige-ai/Virchow2
  data: null
  license: CC-BY-NC-ND-4.0 (gated, institutional email required)
  maturity: R
  reality_check: 'top-tier but not uniformly. CLS+mean-of-patch-tokens embedding is required to reproduce
    reported numbers, not CLS alone. pretraining corpus is proprietary so benchmark contamination cannot
    be audited. licence blocks anything commercial.

    '
  endorsements:
  - source: Nature Biomedical Engineering 2025, 19 FMs / 13 cohorts / 6818 patients
    claim: best vision-only model, significantly better than all others on 6-12 tasks; ties CONCH overall
    url: https://www.nature.com/articles/s41551-025-01516-3
  - source: medRxiv/PMC 2025, 31 FMs across 41 tasks
    claim: highest mean performance on TCGA tasks (0.706 +/- 0.10); top-3 on CPTAC
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12236927/
  - source: Bioengineering 2026 review
    claim: named top-tier alongside CONCH and H-Optimus-1
    url: https://www.mdpi.com/2306-5354/13/5/577
  tissue: pan-cancer, multi-organ (3.1M WSI, globally diverse)
  data_types:
    input:
    - SVS/TIFF/OME-TIFF WSI tiles 224px
    output:
    - 1280-d tile embedding (use CLS+mean)
- id: virchow2g
  name: Virchow2G / Virchow2G-Mini
  category: patch-encoder
  tasks:
  - tile-embedding
  model_type: vision SSL (DINOv2), ViT-G, 1.9B params; Mini distilled to 22M
  modality:
  - H&E WSI
  training:
    corpus: 1.9B tiles from 3.1M WSIs
    tissues: pan-cancer
    public: false
  org: Paige
  paper: https://arxiv.org/abs/2408.00738
  github: null
  hf: null
  license: CC-BY-NC-ND-4.0
  maturity: R
  reality_check: 'Virchow2G-Mini at 22M params is competitive with 632M-1.1B models on HEST-Benchmark.
    if inference cost matters this is the interesting entry, not the giant.

    '
  endorsements:
  - source: Virchow2 paper self-report
    claim: Virchow2G best average on HEST-Benchmark (0.350), ahead of H-optimus-0 (0.347)
    url: https://arxiv.org/html/2408.00738v3
  tissue: pan-cancer, multi-organ
  data_types:
    input:
    - WSI tiles
    output:
    - tile embedding
- id: uni
  name: UNI / UNI2
  category: patch-encoder
  tasks:
  - tile-embedding
  - tile-classification
  - weakly-supervised-slide
  model_type: vision SSL (DINOv2), ViT-L (UNI) / ViT-H (UNI2)
  modality:
  - H&E WSI
  training:
    corpus: 100M tiles / ~100k WSIs (Mass-100K)
    tissues: pan-cancer BWH+MGH+GTEx
    public: false
  org: Mahmood Lab, Harvard/BWH
  paper: https://www.nature.com/articles/s41591-024-02857-3
  github: mahmoodlab/UNI
  hf: MahmoodLab/UNI
  license: CC-BY-NC-ND-4.0 (gated)
  maturity: R
  reality_check: 'UNI2 does NOT uniformly beat UNI - at least one 41-task benchmark has UNI ahead (0.70
    vs 0.69). do not upgrade on version number. UNI is the most pretraining-token-efficient model tested.

    '
  endorsements:
  - source: Nature Communications 2025 clinical benchmark
    claim: most efficient model per pretraining dataset size; best on lung NGS mutation tasks
    url: https://www.nature.com/articles/s41467-025-58796-1
  tissue: pan-cancer (BWH/MGH/GTEx)
  data_types:
    input:
    - WSI tiles 256px
    output:
    - 1024-d (UNI) / 1536-d (UNI2) tile embedding
- id: conch
  name: CONCH / CONCHv1.5
  category: vision-language-encoder
  tasks:
  - tile-embedding
  - zero-shot-classification
  - cross-modal-retrieval
  model_type: vision-language (CoCa-style contrastive captioning)
  modality:
  - H&E WSI
  - pathology text captions
  training:
    corpus: 1.17M image-caption pairs
    tissues: pan-cancer
    public: false
  org: Mahmood Lab
  paper: https://www.nature.com/articles/s41591-024-02856-4
  github: mahmoodlab/CONCH
  hf: MahmoodLab/CONCH
  license: CC-BY-NC-ND-4.0 (gated)
  maturity: R
  reality_check: 'the quiet winner. far smaller than the giants yet matches Virchow2 overall and leads
    on prognostic tasks. lower embedding dimension also behaves better under ridge regression - the giants
    suffer curse-of-dimensionality on small-n spatial tasks.

    '
  endorsements:
  - source: Nature Biomedical Engineering 2025
    claim: highest AUROC across 29 binary tasks; leads 7 prognostic tasks; on par with Virchow2 overall
    url: https://www.nature.com/articles/s41551-025-01516-3
  - source: HEST-Benchmark
    claim: best ridge-regression result for gene expression prediction (0.316)
    url: https://github.com/mahmoodlab/HEST
  tissue: pan-cancer
  data_types:
    input:
    - WSI tiles
    - free text
    output:
    - 512-d joint image-text embedding
    - zero-shot logits
- id: prov-gigapath
  name: Prov-GigaPath
  category: patch-encoder + slide-encoder
  tasks:
  - tile-embedding
  - slide-embedding
  - mutation-prediction
  - subtyping
  model_type: DINOv2 tile encoder (ViT-G) + LongNet slide aggregator (masked autoencoder)
  modality:
  - H&E WSI
  - IHC WSI
  training:
    corpus: 1.3B tiles / 171189 WSIs / 30000+ patients
    tissues: 31 tissue types, Providence Health network, 28 US cancer centers
    public: false
  org: Microsoft Research + Providence
  paper: https://www.nature.com/articles/s41586-024-07441-w
  github: prov-gigapath/prov-gigapath
  hf: prov-gigapath/prov-gigapath
  license: gated, non-commercial
  maturity: R
  reality_check: 'excels on lung and pan-cancer - almost certainly because lung is over-represented in
    pretraining. this is the canonical worked example of why you read pretraining composition before trusting
    a leaderboard. real-world US cohort, so distribution is closer to clinic than TCGA-trained models.

    '
  endorsements:
  - source: PMC 2025 41-task benchmark
    claim: highest performance on tumor type classification; top-3 on CPTAC
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12236927/
  - source: Nat Methods 2026 AI proteomics Perspective (Sun et al.)
    claim: cited as the whole-slide foundation model precedent from digital pathology
    url: https://www.nature.com/articles/s41592-026-03085-y
  tissue: 31 tissue types, Providence real-world US cohort
  data_types:
    input:
    - WSI tiles 256px
    output:
    - 1536-d tile embedding
    - slide embedding via LongNet
