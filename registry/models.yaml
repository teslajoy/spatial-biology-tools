  paper: https://www.biorxiv.org/content/10.1101/2025.02.05.636714
  github: bowang-lab/scGPT-spatial
  maturity: R
  reality_check: 'the MoE-per-protocol decoder is the right architectural response to platform heterogeneity
    and is the part worth stealing even if you do not use the model. human-only.

    '
  endorsements:
  - source: Advanced Science 2026 spatial omics guide
    claim: cited as the reference approach for cross-modal imputation of sparse spatial data
    url: https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.202520806
  tissue: human, four ST protocols
  data_types:
