- id: titan
  name: TITAN
  category: slide-encoder + vision-language
  tasks:
  - slide-embedding
  - zero-shot-classification
  - rare-cancer-retrieval
  - report-generation
  model_type: multimodal whole-slide VLM, built on CONCHv1.5 patch features (512px @ 20x)
  modality:
  - H&E WSI
  - pathology reports
  - synthetic captions
  training:
    corpus: 335645 WSIs (Mass-340K) + 182000 reports + 423000 PathChat-generated synthetic captions
    tissues: neoplastic, infectious, inflammatory; BWH/MGH private + GTEx public
    public: partial (GTEx portion)
  org: Mahmood Lab
  paper: https://www.nature.com/articles/s41591-025-03824-2
  github: mahmoodlab/TITAN
  hf: MahmoodLab/TITAN
  data: https://huggingface.co/MahmoodLab/TITAN (TCGA_TITAN_features.pkl precomputed)
  license: CC-BY-NC-ND-4.0 (gated, institutional email)
  maturity: T
  reality_check: 'published in Nature Medicine and genuinely strong, but 423k of its captions are machine-generated
    by PathChat. that is a provenance question nobody is asking loudly enough - a model trained on another
    model''s output, evaluated by the same lab. precomputed TCGA features are a real time-saver.

    '
  tissue: neoplastic/infectious/inflammatory, pan-organ
  data_types:
    input:
    - CONCHv1.5 patch features 512px@20x
    - pathology report text
    output:
    - slide embedding
    - generated report text
    - zero-shot logits
