- id: nicheformer
  name: Nicheformer
  category: spatial-omics-FM
  tasks:
  - cell-embedding
  - spatial-label-transfer
  - niche-density-prediction
  - spatial-deconvolution
  model_type: transformer (autoregressive/masked), single-cell + spatial joint pretraining
  modality:
  - scRNA-seq dissociated
  - imaging-based spatial transcriptomics
  training:
    corpus: SpatialCorpus-110M (110M+ cells; ~57M dissociated + ~53M spatially resolved)
    tissues: 73 human and mouse tissues, 17 organs, 18 cell lines
    public: true
  org: Theis lab, Helmholtz Munich
  paper: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12695652/
  github: theislab/nicheformer
  hf: null
  data: SpatialCorpus-110M
  license: open
  maturity: R
  reality_check: 'genuinely useful trick - transfers spatial context onto dissociated scRNA-seq, so legacy
    single-cell archives gain neighbourhood information. but it uses gene expression ONLY and discards
    spatial coordinates, which several follow-ups call out explicitly.

    '
  endorsements:
  - source: SToFM (ICML 2025)
    claim: acknowledged as the ST-specialised single-cell model, while noting it ignores spatial coordinates
    url: https://arxiv.org/pdf/2507.11588
  tissue: 73 human and mouse tissues, 17 organs
  data_types:
    input:
    - AnnData (.h5ad) expression, no coordinates used
    output:
    - cell embedding
    - spatial label
    - niche density
- id: scgpt-spatial
  name: scGPT-spatial
  category: spatial-omics-FM
  tasks:
  - cross-modal-imputation
  - deconvolution
  - protocol-harmonisation
  model_type: transformer with Mixture-of-Experts decoder, continual pretraining from scGPT
  modality:
  - Visium
  - Visium HD
  - Xenium
  - MERFISH
  training:
