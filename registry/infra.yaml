  name: PathBench
  category: benchmark-harness
  org: HKUST (birkhoffkiki)
  github: birkhoffkiki/PathBench
  docs: https://birkhoffkiki.github.io/PathBench/
  maturity: I
  reality_check: '20+ pathology foundation models, multi-organ real-world clinical datasets, 10 validation
    runs with varied seeds on identical hardware and preprocessing. dynamic leaderboards. check this before
    believing any single-paper claim.

    '
  tissue: breast, lung, colorectal, prostate, kidney and others
  data_types:
    input:
    - WSI + labels
    output:
    - leaderboard metrics, heatmaps
