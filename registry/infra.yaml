- id: spatial-clinical-gap
  name: spatial omics clinical status (placeholder row - track, do not adopt)
  category: clinical-product
  maturity: T
  reality_check: 'THERE IS NO FDA-CLEARED SPATIAL TRANSCRIPTOMICS OR SPATIAL PROTEOMICS DIAGNOSTIC. CLIA/CAP-accredited
    service labs exist and trials are running (ex. NCT07624981 DIAGNO-KA, spatial transcriptomics for
    cutaneous precancer progression, active 2026). named blockers are cost at clinical scale, reproducibility
    across centres, and the absence of multi-centre prospective validation with clinically compliant SOPs.
    every regulated product above is an H&E morphology classifier.

    '
  endorsements:
  - source: Nature Reviews Bioengineering 2026, Clinical translation of spatial omics
    claim: dedicated review of the translation gap
    url: https://www.nature.com/articles/s44222-026-00458-y
  - source: PLOS Medicine 2026
    claim: H&E morphology plus virtual spatial proteomics outperformed conventional approaches for immunotherapy
      response in lung
    url: https://journals.plos.org/plosmedicine/article?id=10.1371%2Fjournal.pmed.1005049
  tissue: all
  data_types:
    input:
    - n/a
    output:
    - n/a
