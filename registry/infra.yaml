- id: patho-bench
  name: Patho-Bench
  category: benchmark-harness
  tasks:
  - model-evaluation
  org: Mahmood Lab
  paper: https://arxiv.org/abs/2502.06750
  github: mahmoodlab/patho-bench
  hf: MahmoodLab/patho-bench
  maturity: I
  reality_check: '42 public WSI-level and patient-level tasks with canonical train-test splits across
    six families - morphological subtyping, tumour grading, molecular subtyping, mutation prediction,
    treatment response, survival. handles thousands of parallel experiments. the most extensive public
    computational pathology benchmark released to date.

    '
  tissue: pan-cancer, 42 tasks
  data_types:
    input:
    - slide/patient features h5
    output:
    - benchmark metrics with canonical splits
