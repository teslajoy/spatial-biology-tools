- id: trident
  name: TRIDENT
  category: pipeline
  tasks:
  - tissue-segmentation
  - patching
  - patch-embedding
  - slide-embedding
  - format-conversion
  model_type: orchestration toolkit (not a model)
  modality:
  - H&E WSI
  - IHC
  - multi-stain; OpenSlide/CuCIM/OME-Zarr/CZI/SDPC/PNG/JPEG readers
  org: Mahmood Lab
  paper: https://arxiv.org/abs/2502.06750
  github: mahmoodlab/TRIDENT
  license: CC-BY-NC-ND-4.0 - non-commercial academic only
  maturity: I
  reality_check: 'the single highest-leverage adoption on this page. one command from WSI directory to
    embeddings, 22+ patch encoders and 5 slide encoders (Titan, GigaPath, PRISM, CHIEF, Madeleine, Feather)
    behind one API, plus tissue segmentation via GrandQC/HEST/Otsu and optional artifact and pen-mark
    removal. successor to CLAM. LICENCE WARNING - CC-BY-NC-ND blocks any commercial or industry-collaboration
    use.

    '
  tissue: any tissue, any stain
  data_types:
    input:
    - 'WSI: SVS, TIFF, OME-Zarr, CZI, SDPC, PNG/JPEG'
    output:
    - tissue masks (GeoJSON)
    - patch coords (h5)
    - patch/slide features (h5)
- id: clam
  name: CLAM
  category: pipeline
  tasks:
  - weakly-supervised-slide-classification
  - attention-MIL
  org: Mahmood Lab
  paper: https://www.nature.com/articles/s41551-020-00682-w
  github: mahmoodlab/CLAM
  maturity: I
  reality_check: five years of community use, now superseded by TRIDENT for processing but still the reference
    attention-MIL implementation.
  tissue: pan-cancer
  data_types:
    input:
    - patch features h5
    output:
    - slide-level prediction
    - attention heatmaps
- id: mcmicro
  name: MCMICRO
  category: pipeline
  tasks:
  - multiplex-image-processing
  - registration
  - segmentation
  - quantification
  model_type: modular Nextflow pipeline (ASHLAR, Coreograph, Cypository, UnMICST, S3segmenter)
  modality:
  - CyCIF
  - CODEX
  - mIHC
  - IMC
  - MIBI
  - TMA and WSI
  org: Laboratory of Systems Pharmacology, Harvard / HTAN
  paper: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8916956/
  github: labsyspharm/mcmicro
  docs: https://mcmicro.org
  license: MIT
  maturity: I
  reality_check: 'HTAN-native and community-maintained, which matters more than any benchmark - it will
    still exist in three years. modular, so you can swap the segmenter without rewriting.

    '
  tissue: any; TMA and WSI
  data_types:
    input:
    - per-cycle multiplex images
    output:
    - registered OME-TIFF
    - segmentation masks
    - single-cell feature CSV
- id: scimap
  name: SCIMAP
  category: analysis-toolkit
  tasks:
  - phenotyping
  - neighbourhood-analysis
  - spatial-statistics
  modality:
  - multiplexed imaging feature tables
  org: Laboratory of Systems Pharmacology
  paper: https://joss.theoj.org/papers/10.21105/joss.06604
  github: labsyspharm/scimap
  license: MIT
  maturity: I
  reality_check: consumes MCMICRO output directly. prior-knowledge phenotyping (marker-rule based) is
    often more reproducible than unsupervised clustering for clinical cohorts.
  tissue: any multiplexed tissue
  data_types:
    input:
    - single-cell feature table (CSV/AnnData)
    output:
    - phenotypes
    - neighbourhood statistics
    - plots
- id: steinbock
  name: steinbock
  category: pipeline
  tasks:
  - imc-processing
  - segmentation
  - quantification
  modality:
  - Imaging Mass Cytometry
  org: Bodenmiller lab
  paper: https://www.nature.com/articles/s41596-023-00881-0
  github: BodenmillerGroup/steinbock
  maturity: I
  reality_check: the IMC equivalent of MCMICRO. containerised, reproducible.
  tissue: any; IMC
  data_types:
    input:
    - IMC .mcd/.txt
    output:
    - OME-TIFF
    - masks
    - single-cell tables
- id: spatialdata
  name: SpatialData
  category: data-framework
  tasks:
  - storage
  - coordinate-transforms
  - cross-modal-query
  - ML-dataloading
  model_type: format spec + python library, built on OME-NGFF / OME-Zarr + Parquet
  modality:
  - all major spatial omics platforms via spatialdata-io readers
  org: scverse (Stegle/Marconato et al.)
  paper: https://www.nature.com/articles/s41592-024-02212-x
  github: scverse/spatialdata
  docs: https://spatialdata.scverse.org
  license: BSD-3
  maturity: I
  reality_check: 'THE convergence point. five primitives (images, labels, points, shapes, tables), explicit
    coordinate transforms tracked on disk, lazy loading of larger-than-memory data, cloud IO, and a PyTorch
    Dataset class so you can train directly off the store. as of the June 2026 hackathon it also has R/Bioconductor
    interop, 2.5D/3D rendering, chunked multiscale points, and a language-agnostic OME-NGFF coordinate-transform
    conformance test suite. if you are designing schema work, design against this.

    '
  endorsements:
  - source: Advanced Science 2026 spatial omics guide
    claim: named with OME-Zarr as the standardisation effort providing unified data architectures
    url: https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.202520806
  - source: 2nd SpatialData Hackathon report (BioHackrXiv, June 2026)
    claim: R interop, 3D rendering, cloud IO, lazy file linking and NGFF conformance suite delivered
    url: https://index.biohackrxiv.org/2026/06/07/s6bph.html
  tissue: any
  data_types:
    input:
    - 'vendor formats via spatialdata-io: Visium, Xenium, MERSCOPE, CosMx, IMC, CODEX'
    output:
    - OME-Zarr + Parquet SpatialData store
    - PyTorch Dataset
